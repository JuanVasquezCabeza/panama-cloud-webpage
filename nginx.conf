worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging optimization: standard log format but minimal verbosity or disabled access log for maximum RAM savings
    access_log off;
    
    # TCP optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Keepalive timeout
    keepalive_timeout 65;
    keepalive_requests 100;

    # Buffer size tunings to guarantee <10MB RAM footprint
    client_body_buffer_size 10k;
    client_header_buffer_size 1k;
    client_max_body_size 1k;
    large_client_header_buffers 2 1k;

    # Gzip Compression (Cloudflare will handle deeper compression, but we do basic compression)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml+rss;

    # Language entry for "/": the visitor's explicit choice (cookie "lang", set by the header switcher) wins,
    # otherwise the browser's Accept-Language, otherwise English. Deep links are never redirected by language.
    map $cookie_lang $lang_cookie { default ""; en en; es es; }
    map $http_accept_language $lang_accept { default en; "~*^es" es; }
    map $lang_cookie $lang_root { default $lang_cookie; "" $lang_accept; }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;  # keep /products-and-solutions -> /products-and-solutions/ relative behind Cloudflare/Traefik

        # Add proper cache-control headers for Cloudflare caching
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=300, must-revalidate";  # pages are regenerated from the CRM; keep browser/CDN caches short
        }

        location = / {
            add_header Vary "Accept-Language, Cookie";
            add_header Cache-Control "no-store";
            return 302 /$lang_root/;
        }

        # Old English-only URL, now under /en/
        location ~ ^/products-and-solutions/?$ {
            return 301 /en/products-and-solutions/;
        }

        # Healthcheck endpoint for Coolify
        location /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        # Custom 404 page redirect to index
        error_page 404 /index.html;
    }
}
